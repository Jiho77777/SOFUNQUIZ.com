<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Jailbreak</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10172e;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:12px}h1{margin:8px}p{color:#d4e0ff}#game{display:block;width:min(960px,100%);height:auto;margin:12px auto;border:3px solid #80eaff;border-radius:14px;touch-action:none}.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.key{background:#25365f;border:1px solid #718bc8;border-radius:10px;padding:8px 12px}button{font-size:18px;padding:10px 16px;border:0;border-radius:12px;background:#ffe16b;font-weight:900;margin:4px;touch-action:none}.mobile{display:none}.overlay{position:fixed;inset:0;background:#080d22dd;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}.box{background:#202d57;border:2px solid #7eeaff;border-radius:20px;padding:22px;width:min(540px,100%);box-shadow:0 15px 50px #0008}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answers button{background:#40558c;color:white}.hidden{display:none!important}@media(max-width:650px){.mobile{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.mobile button{min-width:65px}body{padding:5px}.answers{grid-template-columns:1fr 1fr}}
</style></head><body>
<h1>🔷 GEOMETRY JAILBREAK</h1><p>감옥에 갇힌 도형 친구들을 구출하라! 🔐 정답을 맞히면 감옥이 열려!</p>
<div class="row"><span class="key">이동: A/D 또는 ←/→</span><span class="key">점프: Space / W / ↑</span><span class="key">재시작: R</span></div>
<canvas id="game" width="960" height="540"></canvas><div id="status">STAGE 1 · 도형 0/1 구출</div>
<div class="mobile"><button id="left">⬅️</button><button id="jump">⬆️ 점프</button><button id="right">➡️</button></div><div class="row"><button onclick="resetGame()">처음부터 ↻</button></div>
<div id="quiz" class="overlay hidden"><div class="box"><h2 id="qtitle">🔐 감옥 잠금장치</h2><p id="qtext"></p><div id="answers" class="answers"></div><p id="qfeedback"></p><button id="continue" class="hidden" onclick="closeQuiz()">계속하기 ➜</button></div></div>
<div id="stageClear" class="overlay hidden"><div class="box"><h2>🎉 스테이지 클리어!</h2><p id="clearText"></p><button onclick="nextStage()">다음 스테이지 ➜</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status'),quiz=document.getElementById('quiz');
const keys={};let stage=1,player,cam,platforms,spikes,prisoners,exitX,won=false,dead=false,quizOpen=false,answered=false,frame=0,stageCleared=false;
const questionBank=[
[{q:'세 변의 길이가 모두 같은 삼각형은?',a:['정삼각형','직각삼각형','사다리꼴','오각형'],c:0,e:'정삼각형은 세 변의 길이가 모두 같아.'},{q:'직각은 몇 도일까?',a:['45°','90°','120°','180°'],c:1,e:'직각은 정확히 90°야.'}],
[{q:'한 변이 4cm인 정사각형의 둘레는?',a:['8cm','12cm','16cm','20cm'],c:2,e:'정사각형의 둘레는 한 변 × 4야.'},{q:'변이 5개인 다각형은?',a:['육각형','오각형','사각형','팔각형'],c:1,e:'오각형은 변이 5개야.'}],
[{q:'가로 7cm, 세로 3cm인 직사각형의 넓이는?',a:['10㎠','21㎠','14㎠','28㎠'],c:1,e:'넓이는 가로 × 세로, 7 × 3 = 21㎠.'},{q:'삼각형의 세 각의 합은?',a:['90°','180°','270°','360°'],c:1,e:'삼각형의 내각의 합은 180°야.'}],
[{q:'정육면체의 면은 몇 개일까?',a:['4개','6개','8개','12개'],c:1,e:'정육면체의 면은 6개야.'},{q:'둔각은 어떤 각일까?',a:['90°보다 작은 각','정확히 90°','90°보다 크고 180°보다 작은 각','정확히 180°'],c:2,e:'둔각은 직각보다 크고 평각보다 작아.'}],
[{q:'사각형의 네 각의 합은?',a:['180°','270°','360°','90°'],c:2,e:'사각형의 내각의 합은 360°야.'},{q:'대칭축이 4개인 도형은?',a:['정사각형','일반 평행사변형','일반 삼각형','직각삼각형'],c:0,e:'정사각형은 대칭축이 4개야.'}]
];
function makeStage(){let base=stage*260;platforms=[{x:0,y:470,w:260,h:70},{x:310,y:420,w:150,h:25},{x:510,y:360,w:145,h:25},{x:710,y:300,w:145,h:25},{x:900,y:390,w:200,h:150},{x:1160,y:340,w:150,h:25},{x:1370,y:400,w:170,h:25},{x:1600,y:340,w:250,h:200}];platforms=platforms.map(p=>({...p,x:p.x+(stage-1)*25}));spikes=[{x:265,y:470,w:45},{x:465,y:420,w:45},{x:660,y:360,w:45},{x:860,y:470,w:40},{x:1315,y:470,w:45},{x:1540,y:400,w:45}];prisoners=[{x:570,y:315,emoji:['🔺','🟣','🟦','💎','⭐'][(stage-1)%5],saved:false,doorX:535}];exitX=1780+(stage-1)*25;}
function resetGame(){stage=1;resetStage();}function resetStage(){player={x:45,y:410,w:32,h:42,vx:0,vy:0,ground:false};cam=0;won=false;dead=false;quizOpen=false;answered=false;stageCleared=false;makeStage();quiz.classList.add('hidden');document.getElementById('stageClear').classList.add('hidden');status.textContent='STAGE '+stage+' · 도형 0/1 구출';}
function keydown(e){keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='r')resetStage()}function keyup(e){keys[e.key.toLowerCase()]=false}window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);
function bind(id,key){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false))}bind('left','arrowleft');bind('right','arrowright');bind('jump',' ');
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function openQuiz(){if(quizOpen||prisoners[0].saved)return;quizOpen=true;answered=false;let q=questionBank[(stage-1)%questionBank.length][0];document.getElementById('qtitle').textContent='🔐 STAGE '+stage+' 감옥 잠금장치';document.getElementById('qtext').textContent=q.q;document.getElementById('qfeedback').textContent='정답을 맞히면 도형 친구를 구출할 수 있어!';document.getElementById('continue').classList.add('hidden');let arr=q.a.map((v,i)=>({v,ok:i===q.c})).sort(()=>Math.random()-.5);let box=document.getElementById('answers');box.innerHTML='';arr.forEach(o=>{let b=document.createElement('button');b.textContent=o.v;b.onclick=()=>{if(answered)return;answered=true;if(o.ok){prisoners[0].saved=true;document.getElementById('qfeedback').textContent='🔓 정답! '+prisoners[0].emoji+' 친구를 구했어!';status.textContent='STAGE '+stage+' · 도형 1/1 구출';}else{document.getElementById('qfeedback').textContent='❌ 다시 생각해 봐! '+q.e;answered=false;return}document.getElementById('continue').classList.remove('hidden');[...box.children].forEach(x=>x.disabled=true)};box.appendChild(b)});quiz.classList.remove('hidden')}
function closeQuiz(){quiz.classList.add('hidden');quizOpen=false;player.x=prisoners[0].x+60;}
function nextStage(){stage++;resetStage()}
function update(){if(quizOpen||stageCleared)return;frame++;if(won||dead)return;let l=keys.a||keys.arrowleft,r=keys.d||keys.arrowright,j=keys.w||keys.arrowup||keys[' '];player.vx=l?-4.2:r?4.2:0;if(j&&player.ground){player.vy=-12.5;player.ground=false}player.vy=Math.min(player.vy+.58,14);player.x+=player.vx;player.y+=player.vy;player.ground=false;for(let p of platforms){if(hit(player,p)&&player.vy>=0&&player.y+player.h-player.vy<=p.y+5){player.y=p.y-player.h;player.vy=0;player.ground=true}}
for(let s of spikes){if(hit(player,{x:s.x+4,y:s.y+6,w:s.w-8,h:30})){dead=true;status.textContent='가시에 닿았어! R 키로 다시 도전!'}}
if(!prisoners[0].saved&&hit(player,{x:prisoners[0].x-25,y:prisoners[0].y-30,w:70,h:70}))openQuiz();
if(player.y>600){dead=true;status.textContent='떨어졌어! R 키로 다시 도전!'}
if(player.x>exitX-20){if(prisoners[0].saved){stageCleared=true;document.getElementById('clearText').textContent='STAGE '+stage+' 성공! 도형 친구를 구출했어. 다음 감옥은 더 어려워!';document.getElementById('stageClear').classList.remove('hidden')}else{player.x=exitX-25;status.textContent='출구가 잠겼어! 먼저 도형 친구를 구출해!'}}
cam=Math.max(0,Math.min(player.x-250,exitX-600))}
function draw(){ctx.clearRect(0,0,960,540);let g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#78d8ff');g.addColorStop(1,'#f0fbff');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);ctx.save();ctx.translate(-cam,0);
ctx.fillStyle='#ffffff99';for(let i=0;i<8;i++){let x=(i*190-cam*.2+2000)%1900;ctx.beginPath();ctx.arc(x,80+(i%3)*30,25,0,7);ctx.fill()}
for(let p of platforms){ctx.fillStyle='#87532e';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#45c75c';ctx.fillRect(p.x,p.y,p.w,12);ctx.fillStyle='#9aff79';for(let x=p.x;x<p.x+p.w;x+=25)ctx.fillRect(x,p.y,14,5)}
for(let s of spikes){ctx.fillStyle='#f8fbff';ctx.strokeStyle='#6878a0';for(let x=s.x;x<s.x+s.w;x+=18){ctx.beginPath();ctx.moveTo(x,s.y+18);ctx.lineTo(x+9,s.y-2);ctx.lineTo(x+18,s.y+18);ctx.closePath();ctx.fill();ctx.stroke()}}
let pr=prisoners[0];if(!pr.saved){ctx.fillStyle='#27344f';ctx.fillRect(pr.x-15,pr.y-25,54,58);ctx.strokeStyle='#b8e9ff';ctx.lineWidth=5;for(let x=pr.x-10;x<pr.x+38;x+=14){ctx.beginPath();ctx.moveTo(x,pr.y-22);ctx.lineTo(x,pr.y+30);ctx.stroke()}ctx.strokeStyle='#ffe16b';ctx.lineWidth=4;ctx.strokeRect(pr.x-15,pr.y-25,54,58);ctx.font='28px system-ui';ctx.fillText(pr.emoji,pr.x-2,pr.y+14);ctx.fillStyle='white';ctx.font='bold 14px system-ui';ctx.fillText('QUIZ!',pr.x-9,pr.y-32)}else{ctx.font='30px system-ui';ctx.fillText(pr.emoji,pr.x,pr.y+15);ctx.fillStyle='#1f6e4b';ctx.font='bold 14px system-ui';ctx.fillText('RESCUED!',pr.x-20,pr.y-10)}
ctx.fillStyle='#ff6177';ctx.fillRect(exitX,300,10,90);ctx.fillStyle=pr.saved?'#43dc91':'#ffb94d';ctx.fillRect(exitX+10,300,48,30);ctx.fillStyle='#20365e';ctx.font='bold 14px system-ui';ctx.fillText(pr.saved?'OPEN':'LOCKED',exitX+10,320);
ctx.fillStyle='#397cff';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='white';ctx.fillRect(player.x+6,player.y+9,7,8);ctx.fillRect(player.x+20,player.y+9,7,8);ctx.fillStyle='#17254c';ctx.fillRect(player.x+9,player.y+12,3,4);ctx.fillRect(player.x+23,player.y+12,3,4);ctx.restore();
if(dead){ctx.fillStyle='#10172ecc';ctx.fillRect(0,0,960,540);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 38px system-ui';ctx.fillText('TRY AGAIN',480,255);ctx.font='20px system-ui';ctx.fillText('R 키 또는 처음부터 버튼으로 다시 시작',480,295);ctx.textAlign='left'}}
function loop(){update();draw();requestAnimationFrame(loop)}window.resetGame=resetGame;window.nextStage=nextStage;resetStage();loop();
</script></body></html>
